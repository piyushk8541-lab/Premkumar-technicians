name: Android signed release artifacts

# Artifact generation only. No Play, GitHub Release, website or distribution deployment.
# Manual workflow UI may be unavailable while the workflow is absent from main.
# The exact-file push trigger is a deliberate branch-only alternative: no request file
# is committed during setup, and ordinary app/workflow pushes DO NOT trigger signing.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Explicit Android versionCode, greater than every prior Play upload'
        type: string
        required: true
      version_name:
        description: 'Explicit release versionName, e.g. 1.0.0'
        type: string
        required: true
  push:
    branches:
      - arena/01a09a19-premkumar-technicians
    paths:
      - premkumar-android-app/release/request.json

permissions:
  contents: read

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/arena/01a09a19-premkumar-technicians'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      version_code: ${{ steps.request.outputs.version_code }}
      version_name: ${{ steps.request.outputs.version_name }}
    defaults:
      run:
        shell: bash
        working-directory: premkumar-android-app
    env:
      CI: 'true'
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - name: Check out the exact requested commit without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate explicit artifacts-only intent and release versions
        id: request
        run: python3 scripts/release/request.py
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify original website integrity and branch deployment guard
        run: npm run verify:website
      - name: Set up full JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install pinned Android platform and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test release preparation, icon integrity and web build
        run: |
          npm ci --no-audit --no-fund
          npm run check:release
          npm run check:icons
          npm run check:config
          npm run sync:android
          javac -d "$RUNNER_TEMP/release-verifier-classes" scripts/release/VerifyBundle.java
      - name: Run existing browser regressions
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Test and lint the release variant without signing secrets
        env:
          PK_ANDROID_VERSION_CODE: ${{ steps.request.outputs.version_code }}
          PK_ANDROID_VERSION_NAME: ${{ steps.request.outputs.version_name }}
        run: |
          cd android
          ./gradlew --version | tee "$RUNNER_TEMP/release-gradle-version.txt"
          grep -F 'Gradle 8.14.3' "$RUNNER_TEMP/release-gradle-version.txt"
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache --console=plain :app:testReleaseUnitTest :app:lintRelease

  sign:
    needs: validate
    if: github.ref == 'refs/heads/arena/01a09a19-premkumar-technicians'
    # Owner must first create this environment, restrict it to this branch and configure
    # required reviewers. Never store these secrets as repository/organization secrets.
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: premkumar-android-app
    env:
      CI: 'true'
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - name: Check out the same validated commit without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use a temporary noncached Gradle home
        run: printf 'GRADLE_USER_HOME=%s/pk-release-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require explicit release enablement
        env:
          PK_ANDROID_RELEASE_ENABLED: ${{ vars.PK_ANDROID_RELEASE_ENABLED }}
        run: test "$PK_ANDROID_RELEASE_ENABLED" = true
      - name: Set up Node.js 22 without dependency caching
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Recheck website integrity
        run: npm run verify:website
      - name: Set up full JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install pinned platform and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build bundled assets before exposing any signing secrets
        run: |
          npm ci --no-audit --no-fund
          npm run check:icons
          npm run check:config
          npm run sync:android
      - name: Temporarily load owner key, sign APK and AAB, remove key and verify artifacts
        env:
          PK_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PK_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PK_ANDROID_KEYSTORE_PASSWORD }}
          PK_ANDROID_KEY_ALIAS: ${{ secrets.PK_ANDROID_KEY_ALIAS }}
          PK_ANDROID_KEY_PASSWORD: ${{ secrets.PK_ANDROID_KEY_PASSWORD }}
          PK_ANDROID_UPLOAD_CERT_SHA256: ${{ vars.PK_ANDROID_UPLOAD_CERT_SHA256 }}
          PK_ANDROID_LAST_PLAY_VERSION_CODE: ${{ vars.PK_ANDROID_LAST_PLAY_VERSION_CODE }}
          PK_ANDROID_RELEASE_ENABLED: ${{ vars.PK_ANDROID_RELEASE_ENABLED }}
          PK_ANDROID_VERSION_CODE: ${{ needs.validate.outputs.version_code }}
          PK_ANDROID_VERSION_NAME: ${{ needs.validate.outputs.version_name }}
        run: bash scripts/release/sign-and-verify.sh
      - name: Recheck original website after packaging
        run: npm run verify:website
      - name: Upload only verified signed deliverables and public reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: premkumar-technicians-release-${{ needs.validate.outputs.version_code }}-${{ github.run_id }}
          path: |
            premkumar-android-app/artifacts/release/app-release.apk
            premkumar-android-app/artifacts/release/app-release.aab
            premkumar-android-app/artifacts/release/SHA256SUMS.txt
            premkumar-android-app/artifacts/release/apk-signature.txt
            premkumar-android-app/artifacts/release/apk-metadata.txt
            premkumar-android-app/artifacts/release/apk-alignment.txt
            premkumar-android-app/artifacts/release/aab-signature.txt
            premkumar-android-app/artifacts/release/upload-certificate-sha256.txt
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
      - name: Remove temporary signing material even on failure or cancellation
        if: always()
        working-directory: .
        run: |
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'pk-signing.*' -exec rm -rf -- {} +
          rm -rf -- "$RUNNER_TEMP/pk-release-gradle"
