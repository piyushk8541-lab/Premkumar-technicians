name: Android Build & Deliverables

on:
  push:
    branches:
      - arena/01a0be36-premkumar-technicians
    paths:
      - premkumar-technicians-app/**
      - .github/workflows/android-build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.ref == 'refs/heads/arena/01a0be36-premkumar-technicians'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify original website integrity
        run: |
          node premkumar-technicians-app/scripts/verify-website-unchanged.mjs

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: premkumar-technicians-app/package-lock.json

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android Platforms and Build Tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies & run test suite
        working-directory: premkumar-technicians-app
        run: |
          npm ci || npm install
          npm test
          node scripts/generate-icons.mjs
          npm run build
          npm run sync:android

      - name: Build Debug APK, Run Unit Tests & Lint
        working-directory: premkumar-technicians-app/android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify Debug APK Signature and Metadata
        working-directory: premkumar-technicians-app/android
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" | grep -E "package: name='com.premkumar.technicians'|application-label:'Prem Kumar Technicians'"

      - name: Validate Release Task Graph & Check Signing Secrets
        id: release_check
        working-directory: premkumar-technicians-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.PK_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PK_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PK_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PK_ANDROID_KEY_PASSWORD }}
        run: |
          # Verify release task graph without executing release packaging tasks
          ./gradlew --no-daemon :app:bundleRelease --dry-run
          
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are available."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured in this branch. Temporary keys will NOT be generated."
            echo "Release packaging is deferred until owner-configured secrets are provided."
          fi

      - name: Build Signed Release APK and AAB (Only if Secrets Provided)
        if: steps.release_check.outputs.has_secrets == 'true'
        working-directory: premkumar-technicians-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.PK_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PK_ANDROID_KEYSTORE_PASSWORD }}
          PK_ANDROID_KEY_ALIAS: ${{ secrets.PK_ANDROID_KEY_ALIAS }}
          PK_ANDROID_KEY_PASSWORD: ${{ secrets.PK_ANDROID_KEY_PASSWORD }}
          PK_ANDROID_VERSION_CODE: ${{ vars.PK_ANDROID_VERSION_CODE || '1' }}
          PK_ANDROID_VERSION_NAME: ${{ vars.PK_ANDROID_VERSION_NAME || '1.0.0' }}
        run: |
          KEY_DIR="$(mktemp -d "$RUNNER_TEMP/pk-release.XXXXXXXX")"
          trap 'rm -rf -- "$KEY_DIR"' EXIT
          export PK_ANDROID_KEYSTORE_PATH="$KEY_DIR/upload.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$PK_ANDROID_KEYSTORE_PATH"
          chmod 600 "$PK_ANDROID_KEYSTORE_PATH"

          ./gradlew --no-daemon --no-build-cache :app:assembleRelease :app:bundleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$tools/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -E "package: name='com.premkumar.technicians'|application-label:'Prem Kumar Technicians'"

          mkdir -p ../build-artifacts
          cp app/build/outputs/apk/release/app-release.apk ../build-artifacts/
          cp app/build/outputs/bundle/release/app-release.aab ../build-artifacts/

      - name: Prepare build artifacts directory
        run: |
          mkdir -p premkumar-technicians-app/build-artifacts
          cp premkumar-technicians-app/android/app/build/outputs/apk/debug/app-debug.apk premkumar-technicians-app/build-artifacts/app-debug.apk
          cd premkumar-technicians-app/build-artifacts
          sha256sum app-debug.apk $(test -f app-release.apk && echo "app-release.apk") $(test -f app-release.aab && echo "app-release.aab") > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: premkumar-technicians-android-artifacts
          path: premkumar-technicians-app/build-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Commit build artifacts to repository branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add premkumar-technicians-app/build-artifacts/
          git commit -m "build(android): deliver verified debug APK artifact [skip ci]" || echo "No artifact diff"
          git push origin arena/01a0be36-premkumar-technicians

      - name: Recheck website hashes after native build
        run: |
          node premkumar-technicians-app/scripts/verify-website-unchanged.mjs
