name: Android debug APK

# The push trigger bootstraps CI on this branch without adding anything to main.
# workflow_dispatch is usable only if GitHub exposes this workflow for manual runs;
# it does not require merging the app into main for the push build to work.
on:
  push:
    branches:
      - arena/01a09a19-premkumar-technicians
    paths:
      - premkumar-android-app/**
      - .github/workflows/android-debug.yml
      - vercel.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    if: github.ref == 'refs/heads/arena/01a09a19-premkumar-technicians'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: premkumar-android-app
    env:
      CI: 'true'
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

    steps:
      - name: Check out this branch's existing project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Protect the original website and branch-only deployment guard
        working-directory: .
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          baseline = json.loads((root / 'premkumar-android-app/docs/website-baseline.json').read_text())
          for path, expected in baseline['files'].items():
              original = subprocess.check_output(['git', 'show', f"{baseline['commit']}:{path}"])
              assert hashlib.sha256(original).hexdigest() == expected, f'Invalid baseline: {path}'
              assert hashlib.sha256((root / path).read_bytes()).hexdigest() == expected, f'Website changed: {path}'
          changed = subprocess.check_output(['git', 'diff', '--name-only', baseline['commit'], 'HEAD'], text=True).splitlines()
          exceptions = {'.github/workflows/android-debug.yml', 'vercel.json'}
          assert all(p.startswith('premkumar-android-app/') or p in exceptions for p in changed), changed
          guard = json.loads((root / 'vercel.json').read_text())
          assert guard['git']['deploymentEnabled'] == {'arena/01a09a19-premkumar-technicians': False}
          print('All six original files are byte-for-byte unchanged; only authorized app/CI files differ.')
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: premkumar-android-app/package-lock.json

      - name: Set up full Temurin JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install exact Android platform and Build Tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          java -version
          javac -version
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Set up Gradle caching (use the project's pinned wrapper)
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: false

      - name: Install locked frontend and Capacitor dependencies
        run: npm ci --no-audit --no-fund

      - name: Build local web assets and synchronize Android
        run: |
          npm run check:config
          npm run sync:android
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('.')
          package = json.loads((root / 'package.json').read_text())
          for name in ['@capacitor/core', '@capacitor/android']:
              assert package['dependencies'][name] == '8.4.3'
          assert package['devDependencies']['@capacitor/cli'] == '8.4.3'
          app = (root / 'android/app/build.gradle').read_text()
          assert 'applicationId "com.premkumar.technicians"' in app
          assert 'namespace = "com.premkumar.technicians"' in app
          assert 'buildToolsVersion = "35.0.0"' in app
          variables = (root / 'android/variables.gradle').read_text()
          assert 'compileSdkVersion = 36' in variables and 'targetSdkVersion = 36' in variables
          assert 'gradle:8.13.0' in (root / 'android/build.gradle').read_text()
          config = json.loads((root / 'android/app/src/main/assets/capacitor.config.json').read_text())
          assert config['appId'] == 'com.premkumar.technicians'
          assert config['webDir'] == 'dist' and not config.get('server', {}).get('url')
          assert (root / 'android/app/src/main/assets/public/index.html').is_file()
          PY

      - name: Verify Gradle 8.14.3 and build the real debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --version | tee "$RUNNER_TEMP/premkumar-gradle-version.txt"
          grep -F 'Gradle 8.14.3' "$RUNNER_TEMP/premkumar-gradle-version.txt"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature, package, SDK and alignment
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p artifacts/ci
          "$tools/apksigner" verify --verbose --print-certs "$apk" > artifacts/ci/signature-verification.txt
          "$tools/aapt" dump badging "$apk" > artifacts/ci/apk-metadata.txt
          grep -F "package: name='com.premkumar.technicians'" artifacts/ci/apk-metadata.txt
          grep -F "sdkVersion:'24'" artifacts/ci/apk-metadata.txt
          grep -F "targetSdkVersion:'36'" artifacts/ci/apk-metadata.txt
          grep -F 'application-debuggable' artifacts/ci/apk-metadata.txt
          "$tools/zipalign" -c -P 16 -v 4 "$apk" > artifacts/ci/alignment-verification.txt
          python3 - <<'PY'
          import pathlib, zipfile
          apk = pathlib.Path('android/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
              assert 'assets/public/index.html' in archive.namelist()
              assert 'classes.dex' in archive.namelist()
              native = [p for p in archive.namelist() if p.endswith('.so')]
              print(f'APK ZIP integrity verified: {apk.stat().st_size} bytes; native libraries: {native}')
          PY
          cp "$apk" artifacts/ci/app-debug.apk
          (cd artifacts/ci && sha256sum app-debug.apk > SHA256SUMS.txt)

      - name: Validate future signed AAB configuration without creating an AAB
        # The already-generated PUBLIC DEBUG key is used only to inspect the task graph.
        # --dry-run executes no release tasks and produces no signed/unsigned AAB.
        # A real Play upload must use the owner's private upload key, never this debug key.
        run: |
          export PK_ANDROID_KEYSTORE_PATH="$HOME/.android/debug.keystore"
          export PK_ANDROID_KEYSTORE_PASSWORD=android
          export PK_ANDROID_KEY_ALIAS=androiddebugkey
          export PK_ANDROID_KEY_PASSWORD=android
          test -f "$PK_ANDROID_KEYSTORE_PATH"
          (cd android && ./gradlew --no-daemon :app:bundleRelease --dry-run) | tee artifacts/ci/release-task-graph.txt
          grep -F ':app:signReleaseBundle' artifacts/ci/release-task-graph.txt
          test -z "$(find android/app/build/outputs -type f -name '*.aab' -print -quit)"

      - name: Recheck website hashes after the build
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          baseline = json.loads(pathlib.Path('docs/website-baseline.json').read_text())
          for path, expected in baseline['files'].items():
              assert hashlib.sha256((pathlib.Path('..') / path).read_bytes()).hexdigest() == expected, path
          print('Original website remains unchanged after native build.')
          PY

      - name: Upload verified phone-test APK
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: premkumar-technicians-debug-apk
          path: |
            premkumar-android-app/artifacts/ci/app-debug.apk
            premkumar-android-app/artifacts/ci/SHA256SUMS.txt
            premkumar-android-app/artifacts/ci/apk-metadata.txt
            premkumar-android-app/artifacts/ci/signature-verification.txt
            premkumar-android-app/artifacts/ci/alignment-verification.txt
            premkumar-android-app/artifacts/ci/release-task-graph.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Add phone download instructions to the run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          {
            echo '## Android phone preview — debug APK'
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Artifact ID: \`$ARTIFACT_ID\`"
            echo "[Download the verified APK artifact]($ARTIFACT_URL)"
            echo ''
            echo 'On Android: sign into GitHub in Chrome, open this run, and tap the artifact under Artifacts. Enable Desktop site if needed. GitHub downloads an artifact ZIP; extract it in Files/Files by Google, then tap app-debug.apk. Allow Install unknown apps for that file manager if prompted. This is the compiled APK, not the source-project ZIP.'
            echo ''
            echo 'Application ID: com.premkumar.technicians. Minimum Android: 7.0 / API 24. Keep Android System WebView updated. Debug signing keys may differ between CI runs; uninstall an old test installation if Android reports a signing conflict.'
            echo ''
            echo 'Future Play release: configure your own PK_ANDROID_KEYSTORE_PATH, PK_ANDROID_KEYSTORE_PASSWORD, PK_ANDROID_KEY_ALIAS and PK_ANDROID_KEY_PASSWORD in a trusted release environment. The signing task graph was dry-run only. No AAB was created; real release signing, Play Console requirements and phone/device testing remain pending.'
            echo ''
            echo '### APK SHA-256'
            echo '```text'
            cat artifacts/ci/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
